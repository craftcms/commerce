# Branches whose translation files are kept in sync, oldest first.
# When branches translate a string differently, the newest branch's translation wins.
branches:
  5.x:
    path: src/translations
    # Languages added in Commerce 5.8. The sync leaves them off 5.x.
    exclude_languages: [ar, cs, cy, da, de-CH, el, es, fa, he, hr, hu, id, is, ko, ky, nn, pl, ru, sv, th, tr, uk, zh]
  6.x: lang
files:
  - commerce.php
source_language: en
commit_message: Update translations
