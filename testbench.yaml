laravel: workbench

providers:
  - Workbench\App\Providers\WorkbenchServiceProvider
  - Inertia\ServiceProvider
  - CraftCms\Aliases\AliasesServiceProvider
  - CraftCms\DependencyAwareCache\CacheServiceProvider
  - CraftCms\Cms\Providers\CraftServiceProvider
  - CraftCms\Yii2Adapter\Yii2ServiceProvider

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: /admin
  install: false # DatabaseSeeder installs Craft and Commerce
  user: 1
  sync:
    - from: vendor/craftcms/cms-assets/resources
      to: public/vendor/craft
    - from: public/build
      to: public/vendor/craftcms/commerce/build
  build:
    - db-seed:
        --class: Workbench\Database\Seeders\DatabaseSeeder
        --force: true
  discovers:
    web: true
    commands: true
    config: true
