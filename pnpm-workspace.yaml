# pnpm 10+ blocks postinstall/build scripts for dependencies by default and wants every
# candidate answered explicitly. Both of these are well-known, trusted packages needed for
# normal operation (@parcel/watcher: Vite's native file watcher; core-js: a transitive
# polyfill dependency) — matches cms's own treatment of @parcel/watcher in its own
# pnpm-workspace.yaml.
allowBuilds:
  '@parcel/watcher': true
  core-js: true
